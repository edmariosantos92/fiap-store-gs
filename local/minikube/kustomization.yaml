# Overlay para desenvolver no minikube: imagens locais (minikube image load) e StorageClass "standard".
#   kubectl apply -k local/minikube
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
images:
  - name: 992859658230.dkr.ecr.us-east-1.amazonaws.com/store-api
    newName: store-api
  - name: 992859658230.dkr.ecr.us-east-1.amazonaws.com/store-worker
    newName: store-worker
  - name: 992859658230.dkr.ecr.us-east-1.amazonaws.com/store-front
    newName: store-front
patches:
  - target: { kind: StorageClass, name: gp3 }
    patch: |
      $patch: delete
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: gp3
  - target: { kind: StatefulSet, name: store-db }
    patch: |
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: standard
