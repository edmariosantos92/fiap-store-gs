# CI das imagens: build -> scan (Trivy) -> push para o ECR do grupo.
# As credenciais do Learner Lab expiram a cada sessao: atualize os secrets do repositorio
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY e AWS_SESSION_TOKEN antes de disparar.
# Sem os secrets, o pipeline ainda constroi e escaneia (pula so o push).
name: imagens

on:
  workflow_dispatch:
    inputs:
      versao_api:
        description: "APP_VERSION gravada na store-api"
        default: "1.0"
  push:
    branches: [main]
    paths: ["store-api/**", "store-worker/**", "store-front/**"]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  imagens:
    runs-on: ubuntu-latest
    env:
      TEM_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && 'sim' || 'nao' }}
    strategy:
      fail-fast: false
      matrix:
        componente: [store-api, store-worker, store-front]
    steps:
      - uses: actions/checkout@v4

      - name: Versao
        id: v
        run: |
          if [ "${{ matrix.componente }}" = "store-api" ]; then
            echo "tag=${{ github.event.inputs.versao_api || '1.0' }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=1.0" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.componente }}
          platforms: linux/amd64
          load: true
          build-args: APP_VERSION=${{ steps.v.outputs.tag }}
          tags: ${{ matrix.componente }}:${{ steps.v.outputs.tag }}

      - name: Scan Trivy (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ matrix.componente }}:${{ steps.v.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Credenciais AWS
        id: aws
        if: env.TEM_AWS == 'sim'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        if: steps.aws.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push para o ECR
        if: steps.ecr.outcome == 'success'
        run: |
          DEST=${{ steps.ecr.outputs.registry }}/${{ matrix.componente }}:${{ steps.v.outputs.tag }}
          docker tag ${{ matrix.componente }}:${{ steps.v.outputs.tag }} "$DEST"
          docker push "$DEST"
