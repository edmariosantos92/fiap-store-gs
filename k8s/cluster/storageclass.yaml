# O EKS recente nao tem StorageClass padrao: criamos uma gp3 do driver EBS CSI (D2).
# WaitForFirstConsumer: o volume nasce na mesma zona do no onde o Pod foi agendado.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
