# API da FIAP Store (B1-B7, D3, D4, E3, F1, F5).
apiVersion: v1
kind: Service
metadata:
  name: store-api
  namespace: store-prod
  labels:
    app: store-api
spec:
  type: ClusterIP
  selector:
    app: store-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api
  namespace: store-prod
  labels:
    app: store-api
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Sem "replicas": quem decide e o HPA (minimo 3). Declarar aqui faria o Argo CD brigar com o HPA.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # nunca fica abaixo do numero desejado durante o rollout (B7)
      maxSurge: 1
  selector:
    matchLabels:
      app: store-api
  template:
    metadata:
      labels:
        app: store-api
    spec:
      serviceAccountName: store-api
      automountServiceAccountToken: true   # precisa do token para ler o Node
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Espalha as replicas entre zonas (B4) e entre nos.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: store-api
          matchLabelKeys: ["pod-template-hash"]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: store-api
          matchLabelKeys: ["pod-template-hash"]
      containers:
        - name: store-api
          image: store-api:1.0   # registro e tag definidos em k8s/kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: store-api-config
          env:
            # Downward API (D4)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Senha do banco como arquivo, vinda do Secret (E3). DB_PASSWORD_FILE no ConfigMap.
            - name: db-secret
              mountPath: /etc/db-secret
              readOnly: true
      volumes:
        - name: db-secret
          secret:
            secretName: store-db-credentials
            defaultMode: 0440
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: store-api
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: store-api
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
# Drenagem de no nunca derruba mais de uma replica por vez (B6).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: store-api
  namespace: store-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: store-api
