# ServiceAccounts: cada componente com a sua identidade (F1, F2).
# store-api: precisa do token para ler o Node (ClusterRole em k8s/cluster/rbac-cluster.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-api
  namespace: store-prod
---
# store-front e store-worker: nenhuma permissao na API do Kubernetes, token nao montado.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-front
  namespace: store-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: store-worker
  namespace: store-prod
automountServiceAccountToken: false
---
# Desenvolvedores olham, nao mexem (F3): listam Pods e leem logs.
# Sem delete, sem Secrets, sem exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devs-somente-leitura
  namespace: store-prod
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devs-somente-leitura
  namespace: store-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devs-somente-leitura
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: fiap:devs
