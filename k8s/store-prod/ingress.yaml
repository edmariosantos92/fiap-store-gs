# Entrada da loja pelo Traefik (C3, C4).
#   /api -> store-api   |   / -> store-front
# O certificado TLS (Secret store-tls, tipo kubernetes.io/tls) e criado no cluster, fora do Git.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store-ingress
  namespace: store-prod
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - secretName: store-tls
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: store-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store-front
                port:
                  number: 80
